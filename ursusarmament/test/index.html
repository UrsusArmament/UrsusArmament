<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NX-600 Boot Sequence Preview</title>
<style>
  :root {
    --bg: #000000;
    --cmd-color: #d8d8d8;
    --wordmark: #ffffff;
    --subtitle: #b0b0b0;
    --btn-bg: #1a1a1a;
    --btn-border: #444;
    --btn-text: #ddd;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: #1c1c1c;
    overflow: hidden;
  }

  body {
    box-sizing: border-box;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Represents the physical device screen at 1280x800 (landscape).
     Scales to fit the browser viewport while preserving that exact
     aspect ratio, so the outline shows true screen boundaries. */
  #screenFrame {
    position: relative;
    aspect-ratio: 1280 / 800;
    width: min(94vw, calc(94vh * 1280 / 800));
    background: var(--bg);
    border: 2px solid #666;
    box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    box-sizing: border-box;
  }

  #screenFrameLabel {
    position: absolute;
    top: -22px;
    left: 0;
    color: #777;
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Stage 1: terminal log, top-left, stacking lines */
  #cmdLog {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top, 0px));
    left: 28px;
    font-family: "Courier New", monospace;
    color: var(--cmd-color);
    font-size: clamp(12px, 2vw, 15px);
    line-height: 1.5;
    letter-spacing: 0.01em;
    white-space: pre;
    opacity: 0;
  }

  #cmdLog .line {
    display: block;
    opacity: 0;
    transform: translateY(-4px);
  }

  #cmdLog .line.shown {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 90ms ease-out, transform 90ms ease-out;
  }

  #cmdLog .cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--cmd-color);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Stage 2/3: centered logo lockup */
  #crackLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Solid fills. Opacity is applied once per layer group in JS so overlapping
     shapes (branch roots) merge instead of double-darkening. */
  #crackLayer path.crack-shadow    { fill: #000000; stroke: none; }
  #crackLayer path.crack-base      { fill: #8d8d8d; stroke: none; }
  #crackLayer path.crack-highlight { fill: #f1f1f1; stroke: none; }

  #logoContainer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
  }

  #logoStack {
    position: relative;
    width: clamp(110px, 20vw, 170px);
    height: clamp(110px, 20vw, 170px);
  }

  #logoImage, #logoImageMeld {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  #logoImage {
    transform: scale(0.82);
  }

  #logoImageMeld {
    opacity: 0;
  }

  #primaryWordmark {
    margin-top: 16px;
    font-size: clamp(18px, 3.5vw, 25px);
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
  }

  #ursusPart {
    color: var(--wordmark);
  }

  #worksPart {
    color: #D3891E; /* brand orange, sampled from the logo asset */
  }

  #secondarySubtitle {
    margin-top: 6px;
    color: var(--subtitle);
    font-size: clamp(12px, 2.2vw, 15px);
    line-height: 1.3em;
    min-height: 1.3em;
    letter-spacing: 0.18em;
    font-family: "Courier New", monospace;
    opacity: 1;
  }

  #secondarySubtitle .typeCursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--subtitle);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  #statusLine {
    margin-top: 16px;
    color: var(--wordmark);
    font-size: clamp(11px, 2vw, 14px);
    line-height: 1.3em;
    min-height: 1.3em;
    letter-spacing: 0.12em;
    font-family: "Courier New", monospace;
    font-weight: 700;
    opacity: 1;
  }

  #statusLine .typeCursor {
    display: inline-block;
    width: 0.5em;
    height: 1em;
    background: var(--wordmark);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  #replayBtn {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    z-index: 10;
  }

  #replayBtn:hover { background: #2a2a2a; }

  #stageLabel {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 24px;
    color: #444;
    font-family: "Courier New", monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div id="screenFrame">
  <div id="screenFrameLabel">1280 &times; 800</div>
  <div id="stage">
  <div id="cmdLog"></div>
  <svg id="crackLayer" viewBox="0 0 1280 800" preserveAspectRatio="none"></svg>
  <div id="logoContainer">
    <div id="logoStack">
      <img id="logoImage" src="PASTE_IMAGE_1_DATA_URI_HERE" alt="Ursus Works logo">
      <img id="logoImageMeld" src="PASTE_IMAGE_2_DATA_URI_HERE" alt="Ursus Works logo secondary">
    </div>
    <div id="primaryWordmark"><span id="ursusPart">URSUS </span><span id="worksPart">WORKS</span></div>
    <div id="secondarySubtitle">NX-600-CMD</div>
    <div id="statusLine">SYSTEM STARTING...</div>
  </div>
  <button id="replayBtn">&#9654; REPLAY SEQUENCE</button>
  <div id="stageLabel">PLACEHOLDER TIMING &mdash; NOT FINAL BUILD</div>
</div>
</div>

<script>
  var CMD_LINES = [
    "URSUS WORKS // NX-600 CMD STARTUP PROCEDURE",
    "Initializing...",
    "Loading kernel modules...",
    "Mounting secure partition...",
    "Hardware verified",
    "Radio interface: OK",
    "Mesh interface: OK",
    "Encryption verified",
    "TAK core loading...",
    "Calibrating sensors...",
    "Network handshake complete",
    "SYSTEM ARMED"
  ];

  var LINE_INTERVAL_MS = 140;
  var HOLD_AFTER_LOG_MS = 500;
  var LOGO_HOLD_MS = 1000;   // hold on image 1 + URSUS WORKS before it starts swapping
  var FINAL_HOLD_MS = 3000;  // hold once settled on image 2

  var cmdLog = document.getElementById("cmdLog");
  var crackLayer = document.getElementById("crackLayer");
  var logoContainer = document.getElementById("logoContainer");
  var logoStack = document.getElementById("logoStack");
  var logoImage = document.getElementById("logoImage");
  var logoImageMeld = document.getElementById("logoImageMeld");
  var primaryWordmark = document.getElementById("primaryWordmark");
  var worksPart = document.getElementById("worksPart");
  var secondarySubtitle = document.getElementById("secondarySubtitle");
  var statusLine = document.getElementById("statusLine");
  var replayBtn = document.getElementById("replayBtn");

  var timers = [];
  function schedule(fn, delay) {
    var id = setTimeout(fn, delay);
    timers.push(id);
    return id;
  }
  function clearTimers() {
    timers.forEach(function(t) { clearTimeout(t); });
    timers = [];
  }

  function buildCrackLayer() {
    crackLayer.innerHTML = "";

    // Fixed, hand-picked crack layout (not randomized) -- deterministic so
    // it looks the same every time and can be refined by coordinates.
    var FIXED_CRACKS = [
      { main: [{x:283.5,y:0.0},{x:297.5,y:42.3},{x:301.5,y:70.9},{x:299.1,y:116.8},{x:289.8,y:150.7},{x:257.1,y:188.5},{x:237.0,y:232.8},{x:220.5,y:258.7},{x:208.2,y:304.3}], branches: [[{x:299.1,y:116.8},{x:272.8,y:127.9},{x:251.9,y:146.9},{x:229.6,y:168.1},{x:211.4,y:176.3}]] },
      { main: [{x:1019.7,y:0.0},{x:981.9,y:48.6},{x:936.2,y:74.2},{x:896.9,y:89.7},{x:871.4,y:114.3},{x:831.8,y:136.6},{x:784.3,y:170.8}], branches: [[{x:981.9,y:48.6},{x:973.4,y:78.1},{x:958.1,y:104.8},{x:940.3,y:138.6},{x:930.5,y:168.9}]] },
      { main: [{x:0.0,y:663.8},{x:36.7,y:636.3},{x:75.6,y:592.5},{x:102.1,y:516.3},{x:115.5,y:461.5},{x:134.6,y:401.2},{x:132.0,y:349.7}], branches: [[{x:115.5,y:461.5},{x:181.3,y:428.2},{x:213.1,y:396.3},{x:250.4,y:357.6}]] },
      { main: [{x:1280.0,y:523.4},{x:1244.6,y:523.6},{x:1205.1,y:508.7},{x:1170.1,y:496.3},{x:1130.8,y:480.0},{x:1104.6,y:464.7},{x:1067.0,y:440.2},{x:1025.7,y:430.6},{x:987.7,y:413.1},{x:953.8,y:401.2}], branches: [[{x:1104.6,y:464.7},{x:1073.7,y:493.8},{x:1045.7,y:542.9},{x:1006.0,y:588.5}], [{x:1244.6,y:523.6},{x:1215.7,y:501.1},{x:1195.3,y:480.2},{x:1172.2,y:450.8},{x:1154.8,y:435.5}]] },
      { main: [{x:0.0,y:155.1},{x:28.9,y:171.1},{x:68.1,y:198.3},{x:96.0,y:210.0},{x:126.6,y:216.5},{x:164.7,y:217.0},{x:202.6,y:228.9},{x:239.7,y:230.7},{x:281.7,y:250.9},{x:316.0,y:282.0}], branches: [[{x:202.6,y:228.9},{x:205.6,y:258.2},{x:206.5,y:286.6},{x:209.2,y:318.4},{x:209.1,y:352.6}]] },
      { main: [{x:1280.0,y:46.6},{x:1223.3,y:85.1},{x:1185.9,y:116.5},{x:1145.8,y:176.4},{x:1094.4,y:221.2},{x:1062.7,y:285.1},{x:1035.5,y:358.5},{x:993.4,y:421.2}], branches: [[{x:1094.4,y:221.2},{x:1102.8,y:270.7},{x:1140.0,y:331.6},{x:1171.1,y:369.0},{x:1204.8,y:430.4}]] },
      { main: [{x:135.3,y:800.0},{x:165.3,y:742.5},{x:183.4,y:708.4},{x:209.1,y:646.0},{x:206.7,y:599.6},{x:219.1,y:536.8},{x:254.1,y:486.1},{x:288.4,y:456.8}], branches: [[{x:183.4,y:708.4},{x:232.5,y:705.8},{x:262.7,y:700.9},{x:294.4,y:710.0}]] },
      { main: [{x:1154.0,y:800.0},{x:1127.7,y:780.6},{x:1090.0,y:771.1},{x:1047.7,y:770.7},{x:1001.3,y:770.8},{x:949.4,y:792.9},{x:911.2,y:793.6},{x:858.8,y:807.0},{x:816.0,y:818.7},{x:772.7,y:846.7}], branches: [[{x:1047.7,y:770.7},{x:1007.8,y:770.3},{x:957.6,y:747.5},{x:922.7,y:727.6}]] },
      { main: [{x:1026.2,y:800.0},{x:1001.1,y:769.5},{x:960.3,y:743.0},{x:928.1,y:737.5},{x:895.1,y:731.2},{x:853.9,y:738.5},{x:807.3,y:732.2},{x:774.6,y:730.3},{x:743.2,y:715.5}], branches: [[{x:928.1,y:737.5},{x:893.4,y:742.6},{x:869.1,y:738.3},{x:828.0,y:729.5},{x:795.5,y:722.8}], [{x:853.9,y:738.5},{x:858.5,y:708.7},{x:865.1,y:687.4},{x:883.0,y:667.6},{x:902.0,y:657.4}]] },
      { main: [{x:411.7,y:0.0},{x:415.6,y:30.0},{x:400.0,y:77.3},{x:387.0,y:122.1},{x:384.9,y:170.8},{x:391.1,y:219.6},{x:385.1,y:252.0}], branches: [[{x:400.0,y:77.3},{x:423.2,y:100.0},{x:434.4,y:124.6},{x:436.4,y:161.9},{x:455.5,y:198.2}]] },
      { main: [{x:1104.4,y:0.0},{x:1062.5,y:25.2},{x:1027.4,y:58.8},{x:970.1,y:94.2},{x:929.9,y:128.3},{x:883.4,y:167.1},{x:841.2,y:186.2}], branches: [[{x:1027.4,y:58.8},{x:999.4,y:33.0},{x:974.0,y:1.7},{x:963.0,y:-32.0},{x:943.4,y:-76.5}], [{x:970.1,y:94.2},{x:933.3,y:64.5},{x:904.1,y:16.2},{x:874.4,y:-17.3}]] },
      { main: [{x:756.6,y:0.0},{x:759.8,y:22.3},{x:772.8,y:48.8},{x:780.4,y:87.1},{x:776.4,y:116.1},{x:784.3,y:141.8},{x:804.6,y:166.5},{x:833.1,y:184.3},{x:865.5,y:201.9}], branches: [[{x:784.3,y:141.8},{x:786.0,y:165.2},{x:793.6,y:196.7},{x:802.2,y:213.4},{x:818.0,y:229.5}]] },
      { main: [{x:0.0,y:720.5},{x:53.4,y:721.7},{x:124.1,y:706.3},{x:161.8,y:687.5},{x:231.6,y:684.1},{x:290.6,y:691.1},{x:360.4,y:691.2},{x:402.5,y:678.6}], branches: [[{x:231.6,y:684.1},{x:285.7,y:684.1},{x:339.3,y:690.7},{x:373.7,y:709.5},{x:394.1,y:736.2}]] },
      { main: [{x:138.0,y:800.0},{x:164.1,y:755.7},{x:220.6,y:696.3},{x:267.6,y:656.7},{x:299.9,y:600.4},{x:348.5,y:564.8},{x:409.1,y:541.6}], branches: [[{x:164.1,y:755.7},{x:193.8,y:773.9},{x:233.6,y:791.9},{x:269.3,y:805.9},{x:294.6,y:829.6}]] }
    ];

    var EDGE_TOL = 0.6;
    var EDGE_OVERSHOOT = 60; // px pushed past the window edge (clipped by #screenFrame)
    var TIP_WIDTH = 0.13;

    function onEdge(p) {
      return p.x <= EDGE_TOL || p.x >= 1280 - EDGE_TOL ||
             p.y <= EDGE_TOL || p.y >= 800 - EDGE_TOL;
    }

    function perp(dx, dy) {
      var len = Math.hypot(dx, dy) || 1;
      return [-dy / len, dx / len];
    }

    // full width at vertex i of an n-point crack (linear taper by index)
    function fullWidthAt(i, n, baseWidth) {
      return baseWidth + (TIP_WIDTH - baseWidth) * (i / (n - 1));
    }

    function taperedPolygon(points, halfWidths) {
      var n = points.length;
      var left = [], right = [];

      var d0 = perp(points[1].x - points[0].x, points[1].y - points[0].y);
      left.push([points[0].x + d0[0] * halfWidths[0], points[0].y + d0[1] * halfWidths[0]]);
      right.push([points[0].x - d0[0] * halfWidths[0], points[0].y - d0[1] * halfWidths[0]]);

      // beveled joins: separate incoming/outgoing offsets avoid miter fold-back
      for (var i = 1; i < n - 1; i++) {
        var pin = perp(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        var pout = perp(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y);
        var w = halfWidths[i];
        left.push([points[i].x + pin[0] * w, points[i].y + pin[1] * w]);
        left.push([points[i].x + pout[0] * w, points[i].y + pout[1] * w]);
        right.push([points[i].x - pin[0] * w, points[i].y - pin[1] * w]);
        right.push([points[i].x - pout[0] * w, points[i].y - pout[1] * w]);
      }

      var dn = perp(points[n - 1].x - points[n - 2].x, points[n - 1].y - points[n - 2].y);
      var wn = halfWidths[n - 1];
      left.push([points[n - 1].x + dn[0] * wn, points[n - 1].y + dn[1] * wn]);
      right.push([points[n - 1].x - dn[0] * wn, points[n - 1].y - dn[1] * wn]);

      var d = "M " + left[0][0].toFixed(1) + " " + left[0][1].toFixed(1);
      for (var a = 1; a < left.length; a++) d += " L " + left[a][0].toFixed(1) + " " + left[a][1].toFixed(1);
      for (var b = right.length - 1; b >= 0; b--) d += " L " + right[b][0].toFixed(1) + " " + right[b][1].toFixed(1);
      return d + " Z";
    }

    function buildShapePath(shape, mul) {
      var pts = shape.points.slice();
      var n = pts.length;
      var hw = [];
      for (var i = 0; i < n; i++) hw.push(fullWidthAt(i, n, shape.baseWidth * mul) / 2);

      if (shape.anchored) {
        // extend the start straight back along its own direction, past the
        // window edge, so the visible end is flush with the border
        var dx = pts[1].x - pts[0].x, dy = pts[1].y - pts[0].y;
        var len = Math.hypot(dx, dy) || 1;
        pts.unshift({
          x: pts[0].x - (dx / len) * EDGE_OVERSHOOT,
          y: pts[0].y - (dy / len) * EDGE_OVERSHOOT
        });
        hw.unshift(hw[0]);
      }
      return taperedPolygon(pts, hw);
    }

    // Collect shapes: mains (anchored if they start on the border) + branches
    var shapes = [];
    FIXED_CRACKS.forEach(function(unit) {
      var main = unit.main;
      shapes.push({ points: main, baseWidth: 12, anchored: onEdge(main[0]) });

      unit.branches.forEach(function(branch) {
        // cap branch root width to fit inside the main crack at the fork
        var rootBase = 6.7;
        for (var i = 0; i < main.length; i++) {
          if (Math.abs(main[i].x - branch[0].x) < 0.5 && Math.abs(main[i].y - branch[0].y) < 0.5) {
            rootBase = Math.min(6.7, fullWidthAt(i, main.length, 12) * 0.85);
            break;
          }
        }
        shapes.push({ points: branch, baseWidth: rootBase, anchored: false });
      });
    });

    // One group per layer: solid shapes inside, opacity applied once to the group,
    // so overlaps (branch roots) merge with no seam.
    var LAYERS = [
      { cls: "crack-shadow",    dx: 2.4,   dy: 2.4,   mul: 1.3,  opacity: 0.59 },
      { cls: "crack-base",      dx: 0,     dy: 0,     mul: 1.0,  opacity: 0.49 },
      { cls: "crack-highlight", dx: -1.95, dy: -1.95, mul: 0.36, opacity: 0.7 }
    ];
    var SVGNS = "http://www.w3.org/2000/svg";

    LAYERS.forEach(function(layer) {
      var g = document.createElementNS(SVGNS, "g");
      g.setAttribute("transform", "translate(" + layer.dx + " " + layer.dy + ")");
      g.setAttribute("opacity", layer.opacity);
      shapes.forEach(function(shape) {
        var path = document.createElementNS(SVGNS, "path");
        path.setAttribute("d", buildShapePath(shape, layer.mul));
        path.setAttribute("class", layer.cls);
        g.appendChild(path);
      });
      crackLayer.appendChild(g);
    });
  }

  function resetStage() {
    cmdLog.style.transition = "none";
    cmdLog.style.opacity = "0";
    cmdLog.innerHTML = "";

    buildCrackLayer();
    crackLayer.getAnimations().forEach(function(a) { a.cancel(); });
    crackLayer.style.opacity = "0";

    logoContainer.style.transition = "none";
    logoContainer.style.opacity = "0";
    logoImage.getAnimations().forEach(function(a) { a.cancel(); });
    logoImageMeld.getAnimations().forEach(function(a) { a.cancel(); });

    logoImage.style.transition = "none";
    logoImage.style.transform = "scale(0.82)";
    logoImage.style.opacity = "1";
    logoImage.style.filter = "blur(0px)";
    logoImageMeld.style.transition = "none";
    logoImageMeld.style.opacity = "0";
    logoImageMeld.style.transform = "scale(1)";
    logoImageMeld.style.filter = "blur(0px)";

    primaryWordmark.style.transition = "none";
    primaryWordmark.style.opacity = "0";
    worksPart.style.transition = "none";
    worksPart.style.color = "#D3891E";
    secondarySubtitle.style.transition = "none";
    secondarySubtitle.textContent = "";
    statusLine.textContent = "";
  }

  function typeSubtitle(targetEl, text, charIntervalMs, keepCursorAfter, onDone) {
    targetEl.textContent = "";
    var cursor = document.createElement("span");
    cursor.className = "typeCursor";
    targetEl.appendChild(cursor);

    var i = 0;
    function typeNext() {
      if (i < text.length) {
        cursor.insertAdjacentText("beforebegin", text[i]);
        i++;
        schedule(typeNext, charIntervalMs);
      } else {
        if (!keepCursorAfter) cursor.remove();
        if (onDone) onDone(i * charIntervalMs);
      }
    }
    typeNext();
  }

  function runSequence() {
    clearTimers();
    resetStage();

    // ---------- Stage 1: CMD log builds line by line, top-left ----------
    cmdLog.style.opacity = "1";

    var index = 0;
    function addLine() {
      var prevCursor = cmdLog.querySelector(".cursor");
      if (prevCursor) prevCursor.remove();

      if (index < CMD_LINES.length) {
        var span = document.createElement("span");
        span.className = "line";
        span.textContent = CMD_LINES[index];

        if (index === CMD_LINES.length - 1) {
          var cursor = document.createElement("span");
          cursor.className = "cursor";
          span.appendChild(cursor);
        }

        cmdLog.appendChild(span);
        requestAnimationFrame(function() { span.classList.add("shown"); });

        index++;
        schedule(addLine, LINE_INTERVAL_MS);
      } else {
        schedule(runLogoPop, HOLD_AFTER_LOG_MS);
      }
    }
    addLine();

    // ---------- Stage 2: transfer to Image 1 + "URSUS WORKS" ----------
    function runLogoPop() {
      cmdLog.style.transition = "opacity 220ms ease-out";
      cmdLog.style.opacity = "0";

      schedule(function() {
        logoContainer.style.transition = "opacity 240ms ease-out";
        logoImage.style.transition = "transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1)";
        logoContainer.style.opacity = "1";
        logoImage.style.transform = "scale(1)";

        schedule(function() {
          primaryWordmark.style.transition = "opacity 200ms ease-out";
          primaryWordmark.style.opacity = "1";
        }, 120);

        // hold on Image 1 + URSUS WORKS for the requested ~1 second
        schedule(runMeldTransition, 260 + LOGO_HOLD_MS);
      }, 150);
    }

    // ---------- Stage 3: several rapid crossfades, ending on one normal-speed crossfade ----------
    function runMeldTransition() {
      // STEP_COUNT must be odd so the sequence ends on image2
      // (image1 -> image2 -> image1 -> image2 ... -> image2).
      var STEP_COUNT = 7;
      var MIN_STEP_MS = 70;
      var MAX_STEP_MS = 650;
      var CURVE_STEEPNESS = 5; // higher = flickers stay fast longer, sharper snap at the end

      var STEP_DURATIONS = [];
      for (var s = 0; s < STEP_COUNT; s++) {
        var t = s / (STEP_COUNT - 1);
        var eased = Math.pow(t, CURVE_STEEPNESS);
        STEP_DURATIONS.push(Math.round(MIN_STEP_MS + (MAX_STEP_MS - MIN_STEP_MS) * eased));
      }

      // "WORKS" shifts from brand orange to white over the exact same total
      // duration as the crossfade sequence.
      var totalCrossfadeDuration = STEP_DURATIONS.reduce(function(a, b) { return a + b; }, 0);
      worksPart.style.transition = "color " + totalCrossfadeDuration + "ms linear";
      void worksPart.offsetWidth; // force reflow so the transition animates from orange
      worksPart.style.color = "#FFFFFF";

      // Crack layer fades in slowly, starting with the crossfade and
      // continuing through the typed text and into the hold.
      crackLayer.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 3500, easing: "ease-out", fill: "forwards" }
      );

      var topIsImage1 = true; // logoImage (image1) is currently the visible one
      var stepIndex = 0;

      function playStep() {
        if (stepIndex >= STEP_DURATIONS.length) {
          typeSubtitle(secondarySubtitle, "NX-600-CMD", 55, false, function() {
            schedule(function() {
              typeSubtitle(statusLine, "SYSTEM STARTING...", 45, true, function() {
                // holds here indefinitely, cursor kept blinking -- in the
                // real app this ends only when ATAK signals ready.
              });
            }, 300);
          });
          return;
        }

        var dur = STEP_DURATIONS[stepIndex];
        var outEl = topIsImage1 ? logoImage : logoImageMeld;
        var inEl = topIsImage1 ? logoImageMeld : logoImage;

        playMeldStep(outEl, inEl, dur, MAX_STEP_MS);

        topIsImage1 = !topIsImage1;
        stepIndex++;
        schedule(playStep, dur);
      }

      playStep();
    }

    // Amplitude scales with each step's own duration: fast flickers get a
    // subtle jitter, the slow final crossfade gets a fuller movement.
    function playMeldStep(outEl, inEl, durationMs, maxStepMs) {
      var t = durationMs / maxStepMs; // 0 (fastest) .. 1 (slowest/final)

      var scaleOutPeak = 1 + 0.01 + 0.07 * t;
      var scaleInStart = 1 - (0.01 + 0.09 * t);
      var scaleInMid = scaleInStart + (1 - scaleInStart) * 0.6;
      var blurPeak = 2 + 10 * t;

      outEl.animate([
        { opacity: 1,    filter: "blur(0px)",              transform: "scale(1)" },
        { opacity: 0.35, filter: "blur(" + blurPeak + "px)", transform: "scale(" + scaleOutPeak + ")", offset: 0.55 },
        { opacity: 0,    filter: "blur(0px)",              transform: "scale(" + scaleOutPeak + ")" }
      ], { duration: durationMs, easing: "ease-in-out", fill: "forwards" });

      inEl.animate([
        { opacity: 0,   filter: "blur(" + blurPeak + "px)", transform: "scale(" + scaleInStart + ")" },
        { opacity: 0.5, filter: "blur(" + blurPeak + "px)", transform: "scale(" + scaleInMid + ")", offset: 0.45 },
        { opacity: 1,   filter: "blur(0px)",              transform: "scale(1)" }
      ], { duration: durationMs, easing: "ease-in-out", fill: "forwards" });
    }
  }

  replayBtn.addEventListener("click", runSequence);
  runSequence();
</script>
