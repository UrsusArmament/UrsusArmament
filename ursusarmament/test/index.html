<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NX-600 Boot Sequence Preview</title>
<style>
  :root {
    --bg: #000000;
    --cmd-color: #d8d8d8;
    --wordmark: #ffffff;
    --subtitle: #b0b0b0;
    --btn-bg: #1a1a1a;
    --btn-border: #444;
    --btn-text: #ddd;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: #1c1c1c;
    overflow: hidden;
  }

  body {
    box-sizing: border-box;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Represents the physical device screen at 1280x800 (landscape).
     Scales to fit the browser viewport while preserving that exact
     aspect ratio, so the outline shows true screen boundaries. */
  #screenFrame {
    position: relative;
    aspect-ratio: 1280 / 800;
    width: min(94vw, calc(94vh * 1280 / 800));
    background: var(--bg);
    border: 2px solid #666;
    box-shadow: 0 0 0 1px #000, 0 12px 40px rgba(0,0,0,0.6);
    overflow: hidden;
    box-sizing: border-box;
  }

  #screenFrameLabel {
    position: absolute;
    top: -22px;
    left: 0;
    color: #777;
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Stage 1: terminal log, top-left, stacking lines */
  #cmdLog {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top, 0px));
    left: 28px;
    font-family: "Courier New", monospace;
    color: var(--cmd-color);
    font-size: clamp(12px, 2vw, 15px);
    line-height: 1.5;
    letter-spacing: 0.01em;
    white-space: pre;
    opacity: 0;
  }

  #cmdLog .line {
    display: block;
    opacity: 0;
    transform: translateY(-4px);
  }

  #cmdLog .line.shown {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 90ms ease-out, transform 90ms ease-out;
  }

  #cmdLog .cursor {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--cmd-color);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Stage 2/3: centered logo lockup */
  #crackLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #crackLayer path.crack-shadow {
    fill: rgba(0, 0, 0, 0.59);
    stroke: none;
  }

  #crackLayer path.crack-base {
    fill: rgba(141, 141, 141, 0.49);
    stroke: none;
  }

  #crackLayer path.crack-highlight {
    fill: rgba(241, 241, 241, 0.7);
    stroke: none;
  }

  #logoContainer {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
  }

  #logoStack {
    position: relative;
    width: clamp(110px, 20vw, 170px);
    height: clamp(110px, 20vw, 170px);
  }

  #logoImage, #logoImageMeld {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  #logoImage {
    transform: scale(0.82);
  }

  #logoImageMeld {
    opacity: 0;
  }

  #primaryWordmark {
    margin-top: 16px;
    font-size: clamp(18px, 3.5vw, 25px);
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0;
  }

  #ursusPart {
    color: var(--wordmark);
  }

  #worksPart {
    color: #D3891E; /* brand orange, sampled from the logo asset */
  }

  #secondarySubtitle {
    margin-top: 6px;
    color: var(--subtitle);
    font-size: clamp(12px, 2.2vw, 15px);
    line-height: 1.3em;
    min-height: 1.3em;
    letter-spacing: 0.18em;
    font-family: "Courier New", monospace;
    opacity: 1;
  }

  #secondarySubtitle .typeCursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--subtitle);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  #statusLine {
    margin-top: 16px;
    color: var(--wordmark);
    font-size: clamp(11px, 2vw, 14px);
    line-height: 1.3em;
    min-height: 1.3em;
    letter-spacing: 0.12em;
    font-family: "Courier New", monospace;
    font-weight: 700;
    opacity: 1;
  }

  #statusLine .typeCursor {
    display: inline-block;
    width: 0.5em;
    height: 1em;
    background: var(--wordmark);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
  }

  #replayBtn {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-text);
    font-family: "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    z-index: 10;
  }

  #replayBtn:hover { background: #2a2a2a; }

  #stageLabel {
    position: absolute;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 24px;
    color: #444;
    font-family: "Courier New", monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
  }
</style>
</head>

        y: pts[1].y - pts[0].y
      };
      var ns = perp(dStart.x, dStart.y);
      var ws = widthAt(0);
      left.push([pts[0].x + ns.x * ws, pts[0].y + ns.y * ws]);
      right.push([pts[0].x - ns.x * ws, pts[0].y - ns.y * ws]);

      // Continuous miter joins at every bend.
      for (var i = 1; i < n - 1; i++) {
        var din = {
          x: pts[i].x - pts[i - 1].x,
          y: pts[i].y - pts[i - 1].y
        };
        var dout = {
          x: pts[i + 1].x - pts[i].x,
          y: pts[i + 1].y - pts[i].y
        };
        var w = widthAt(i);
        left.push(offsetIntersection(pts[i], din, dout, 1, w));
        right.push(offsetIntersection(pts[i], din, dout, -1, w));
      }

      // Tip cap.
      var dEnd = {
        x: pts[n - 1].x - pts[n - 2].x,
        y: pts[n - 1].y - pts[n - 2].y
      };
      var ne = perp(dEnd.x, dEnd.y);
      var we = widthAt(n - 1);
      left.push([pts[n - 1].x + ne.x * we, pts[n - 1].y + ne.y * we]);
      right.push([pts[n - 1].x - ne.x * we, pts[n - 1].y - ne.y * we]);

      var d = "M " + left[0][0].toFixed(1) + " " + left[0][1].toFixed(1);
      for (var j = 1; j < left.length; j++) {
        d += " L " + left[j][0].toFixed(1) + " " + left[j][1].toFixed(1);
      }
      for (var k = right.length - 1; k >= 0; k--) {
        d += " L " + right[k][0].toFixed(1) + " " + right[k][1].toFixed(1);
      }
      d += " Z";
      return d;
    }

    function addCrackShape(points, baseWidth, isBranch) {
      // Main cracks that originate on the screen edge extend backward past
      // the edge. Because the SVG is clipped by the screen frame, this makes
      // the visible root terminate exactly at the physical border instead of
      // leaving the diagonal gap caused by an offset cap.
      //
      // Branches are deliberately NOT extended backward. They begin exactly
      // at the parent crack's centerline and are drawn first, so the parent
      // crack is painted over the branch root. This hides the branch's end
      // cap without allowing the branch to poke outside the parent crack.
      var startExtension = isBranch ? 0 : 16;

      // Offshoots use only the base layer. The separate shadow/highlight
      // layers were creating a visible shaded collar at the root and made
      // the branch look like a separate bamboo segment. The main crack keeps
      // its full three-layer dimensional treatment.
      var layers = isBranch ? [
        { cls: "crack-base", dx: 0, dy: 0, widthMul: 1.0 }
      ] : [
        { cls: "crack-shadow", dx: 2.4, dy: 2.4, widthMul: 1.3 },
        { cls: "crack-base", dx: 0, dy: 0, widthMul: 1.0 },
        { cls: "crack-highlight", dx: -1.95, dy: -1.95, widthMul: 0.36 }
      ];

      layers.forEach(function(layer) {
        var d = taperedPolygon(points, baseWidth * layer.widthMul, 0.13, startExtension);
        var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", "translate(" + layer.dx + " " + layer.dy + ")");
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", layer.cls);
        g.appendChild(path);
        crackLayer.appendChild(g);
      });
    }

    FIXED_CRACKS.forEach(function(unit) {
      // Paint branches first so the parent crack covers the branch root.
      // This gives a true junction rather than a branch cap sitting on top
      // of the main crack.
      unit.branches.forEach(function(branchPoints) {
        addCrackShape(branchPoints, 6.7, true);
      });
      addCrackShape(unit.main, 12, false);
    });
  }

  function resetStage() {
    cmdLog.style.transition = "none";
    cmdLog.style.opacity = "0";
    cmdLog.innerHTML = "";

    buildCrackLayer();
    crackLayer.getAnimations().forEach(function(a) { a.cancel(); });
    crackLayer.style.opacity = "0";

    logoContainer.style.transition = "none";
    logoContainer.style.opacity = "0";
    logoImage.getAnimations().forEach(function(a) { a.cancel(); });
    logoImageMeld.getAnimations().forEach(function(a) { a.cancel(); });

    logoImage.style.transition = "none";
    logoImage.style.transform = "scale(0.82)";
    logoImage.style.opacity = "1";
    logoImage.style.filter = "blur(0px)";
    logoImageMeld.style.transition = "none";
    logoImageMeld.style.opacity = "0";
    logoImageMeld.style.transform = "scale(1)";
    logoImageMeld.style.filter = "blur(0px)";

    primaryWordmark.style.transition = "none";
    primaryWordmark.style.opacity = "0";
    worksPart.style.transition = "none";
    worksPart.style.color = "#D3891E";
    secondarySubtitle.style.transition = "none";
    secondarySubtitle.textContent = "";
    statusLine.textContent = "";
  }

  function typeSubtitle(targetEl, text, charIntervalMs, keepCursorAfter, onDone) {
    targetEl.textContent = "";
    var cursor = document.createElement("span");
    cursor.className = "typeCursor";
    targetEl.appendChild(cursor);

    var i = 0;
    function typeNext() {
      if (i < text.length) {
        cursor.insertAdjacentText("beforebegin", text[i]);
        i++;
        schedule(typeNext, charIntervalMs);
      } else {
        if (!keepCursorAfter) cursor.remove();
        if (onDone) onDone(i * charIntervalMs);
      }
    }
    typeNext();
  }

  function runSequence() {
    clearTimers();
    resetStage();

    // ---------- Stage 1: CMD log builds line by line, top-left ----------
    cmdLog.style.opacity = "1";

    var index = 0;
    function addLine() {
      var prevCursor = cmdLog.querySelector(".cursor");
      if (prevCursor) prevCursor.remove();

      if (index < CMD_LINES.length) {
        var span = document.createElement("span");
        span.className = "line";
        span.textContent = CMD_LINES[index];

        if (index === CMD_LINES.length - 1) {
          var cursor = document.createElement("span");
          cursor.className = "cursor";
          span.appendChild(cursor);
        }

        cmdLog.appendChild(span);
        requestAnimationFrame(function() { span.classList.add("shown"); });

        index++;
        schedule(addLine, LINE_INTERVAL_MS);
      } else {
        schedule(runLogoPop, HOLD_AFTER_LOG_MS);
      }
    }
    addLine();

    // ---------- Stage 2: transfer to Image 1 + "URSUS WORKS" ----------
    function runLogoPop() {
      cmdLog.style.transition = "opacity 220ms ease-out";
      cmdLog.style.opacity = "0";

      schedule(function() {
        logoContainer.style.transition = "opacity 240ms ease-out";
        logoImage.style.transition = "transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1)";
        logoContainer.style.opacity = "1";
        logoImage.style.transform = "scale(1)";

        schedule(function() {
          primaryWordmark.style.transition = "opacity 200ms ease-out";
          primaryWordmark.style.opacity = "1";
        }, 120);

        // hold on Image 1 + URSUS WORKS for the requested ~1 second
        schedule(runMeldTransition, 260 + LOGO_HOLD_MS);
      }, 150);
    }

    // ---------- Stage 3: several rapid crossfades, ending on one normal-speed crossfade ----------
    function runMeldTransition() {
      // durations for each successive crossfade. Generated on a steep power
      // curve so the early steps stay fast for longer, then snap sharply up
      // to the normal-speed final crossfade, rather than growing evenly.
      // STEP_COUNT must be odd so the sequence ends on image2
      // (image1 -> image2 -> image1 -> image2 ... -> image2).
      var STEP_COUNT = 7;
      var MIN_STEP_MS = 70;
      var MAX_STEP_MS = 650;
      var CURVE_STEEPNESS = 5; // higher = flickers stay fast longer, sharper snap at the end

      var STEP_DURATIONS = [];
      for (var s = 0; s < STEP_COUNT; s++) {
        var t = s / (STEP_COUNT - 1);
        var eased = Math.pow(t, CURVE_STEEPNESS);
        STEP_DURATIONS.push(Math.round(MIN_STEP_MS + (MAX_STEP_MS - MIN_STEP_MS) * eased));
      }

      // "WORKS" gradually shifts from brand orange to white over the exact
      // same total duration as the crossfade sequence, so it finishes
      // transitioning right as image2 finishes settling -- not before, not after.
      var totalCrossfadeDuration = STEP_DURATIONS.reduce(function(a, b) { return a + b; }, 0);
      worksPart.style.transition = "color " + totalCrossfadeDuration + "ms linear";
      // force reflow so the transition actually animates from orange
      void worksPart.offsetWidth;
      worksPart.style.color = "#FFFFFF";

      // Fade the whole crack layer in slowly -- starts alongside the
      // logo's crossfade but keeps gently fading in well past that,
      // continuing through the typed text and into the hold, rather than
      // needing to finish exactly when the logo settles.
      crackLayer.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: 3500, easing: "ease-out", fill: "forwards" }
      );

      var topIsImage1 = true; // logoImage (image1) is currently the visible one
      var stepIndex = 0;

      function playStep() {
        if (stepIndex >= STEP_DURATIONS.length) {
          typeSubtitle(secondarySubtitle, "NX-600-CMD", 55, false, function() {
            schedule(function() {
              typeSubtitle(statusLine, "SYSTEM STARTING...", 45, true, function() {
                // holds here indefinitely, cursor kept blinking -- in the
                // real app this ends only when ATAK signals ready (see
                // notes on the plugin-broadcast approach discussed earlier).
              });
            }, 300);
          });
          return;
        }

        var dur = STEP_DURATIONS[stepIndex];
        var outEl = topIsImage1 ? logoImage : logoImageMeld;
        var inEl = topIsImage1 ? logoImageMeld : logoImage;

        playMeldStep(outEl, inEl, dur, MAX_STEP_MS);

        topIsImage1 = !topIsImage1;
        stepIndex++;
        schedule(playStep, dur);
      }

      playStep();
    }

    // Amplitude scales with each step's own duration instead of reusing one
    // fixed-shape animation stretched/squeezed to fit -- fast flickers get a
    // subtle, barely-there jitter; the slow final crossfade gets a fuller,
    // more deliberate movement. That variation is what reads as the motion
    // actually gaining weight, rather than the same shape looping on repeat.
    function playMeldStep(outEl, inEl, durationMs, maxStepMs) {
      var t = durationMs / maxStepMs; // 0 (fastest) .. 1 (slowest/final)

      var scaleOutPeak = 1 + 0.01 + 0.07 * t;
      var scaleInStart = 1 - (0.01 + 0.09 * t);
      var scaleInMid = scaleInStart + (1 - scaleInStart) * 0.6;
      var blurPeak = 2 + 10 * t;

      outEl.animate([
        { opacity: 1,    filter: "blur(0px)",              transform: "scale(1)" },
        { opacity: 0.35, filter: "blur(" + blurPeak + "px)", transform: "scale(" + scaleOutPeak + ")", offset: 0.55 },
        { opacity: 0,    filter: "blur(0px)",              transform: "scale(" + scaleOutPeak + ")" }
      ], { duration: durationMs, easing: "ease-in-out", fill: "forwards" });

      inEl.animate([
        { opacity: 0,   filter: "blur(" + blurPeak + "px)", transform: "scale(" + scaleInStart + ")" },
        { opacity: 0.5, filter: "blur(" + blurPeak + "px)", transform: "scale(" + scaleInMid + ")", offset: 0.45 },
        { opacity: 1,   filter: "blur(0px)",              transform: "scale(1)" }
      ], { duration: durationMs, easing: "ease-in-out", fill: "forwards" });
    }
  }

  replayBtn.addEventListener("click", runSequence);
  runSequence();
</script>
